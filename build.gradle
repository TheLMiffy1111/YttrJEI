plugins {
	id "com.crystaelix.loom" version "1.13-SNAPSHOT"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "com.crystaelix.blossom" version "1.3.2"
	id "me.modmuss50.mod-publish-plugin" version "1.1.0"
	id "de.undercouch.download" version "5.7.0"
}

repositories {
	mavenCentral()
	flatDir {
		dirs "libs"
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.quiltmc.org/repository/release/"
			}
		}
		filter {
			includeGroup "org.quiltmc"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.parchmentmc.net/"
			}
		}
		filter {
			includeGroup "org.parchmentmc.data"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.nucleoid.xyz/"
			}
		}
		filter {
			includeGroup "eu.pb4"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.terraformersmc.com/"
			}
		}
		filter {
			includeGroup "com.terraformersmc"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.blamejared.com/"
			}
		}
		filter {
			includeGroup "mezz.jei"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.crystaelix.com/releases/"
			}
		}
		filter {
			includeGroup "thelm.jeidrawables"
			includeGroup "thelm.fractaljei"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.ladysnake.org/releases/"
			}
		}
		filter {
			includeGroup "dev.onyxstudios.cardinal-components-api"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.is-immensely.gay/releases/"
			}
		}
		forRepository {
			maven {
				url = "https://repo.unascribed.com/"
			}
		}
		filter {
			includeGroup "de.dafuqs"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://repo.unascribed.com/"
			}
		}
		forRepository {
			flatDir {
				dirs "yttr-libs"
			}
		}
		filter {
			includeGroup "com.unascribed"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://cursemaven.com/"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
}

def mcVersion = "1.20.1"
def modName = "YttrJEI"
def modId = "yttrjei"
def specVersion = "20.1"
def vendor = "thelm"

group = "thelm.yttrjei"
version = "20.1.0"

def archivesName = modName
base.archivesName = archivesName

sourceSets {
	main
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
		vendor = JvmVendorSpec.AZUL
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

loom {
	silentMojangMappingsLicense()
	runs {
		configureEach {
			property "fabric.log.console.level", "debug"
		}
		client {
			programArg "--username=Dev"
		}
		server
	}
}

dependencies {
	// Download and unpack Yttr
	def yttrVersion = "9.20.1031"
	unpackYttr(yttrVersion)

	// Minecraft
	minecraft "com.mojang:minecraft:1.20.1"
	mappings loom.layered {
		mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
		parchment "org.parchmentmc.data:parchment-1.20.1:2023.09.03@zip"
	}
	modImplementation "net.fabricmc:fabric-loader:0.18.1"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.7+1.20.1"
	modImplementation "eu.pb4:placeholder-api:2.1.4+1.20.1"
	modImplementation "com.terraformersmc:modmenu:7.2.2"

	// JEI
	modImplementation("mezz.jei:jei-1.20.1-fabric:15.20.0.129") {transitive = false}
	include(modImplementation("thelm.jeidrawables:JEIDrawables-Fabric:20.1.6"))

	// Yttr Dependencies
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-api:5.2.3"
	[
		"core", "lockpick", "tunnel", "phantom", "waypoint", "weld", "sandman", "crowbar",
		"keygen", "dessicant", "deferral", "machination", "util", "ripple", "recoil", "mesh",
		"aqi", "wrangle", "equivalence", "avant"
	].each { module ->
		modImplementation "com.unascribed:lib39-${module}:2.0.28+1.20.1"
	}
	modImplementation "de.dafuqs:Fractal:1.2.1+unicodesupport4"
	modImplementation "curse.maven:fabric-disable-custom-worlds-advice-401978:4619700"

	// FractalJEI
	include(modImplementation("thelm.fractaljei:FractalJEI-Fabric:2.0.1"))

	// Yttr
	modImplementation "com.unascribed:yttr:${yttrVersion}"
}

def replacements = [
	"0@VERSION@": version
]

blossom {
	replaceToken(replacements)
}

processResources {
	inputs.properties(replacements)
	filesMatching(["mcmod.info", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
		filter {
			it.replace(replacements)
		}
	}
}

def manifestAttributes = [
	"Specification-Title": modName,
	"Specification-Vendor": vendor,
	"Specification-Version": specVersion,
	"Implementation-Title": archivesName,
	"Implementation-Version": version,
	"Implementation-Vendor": vendor
]

jar {
	manifest.attributes(manifestAttributes)
}

sourcesJar {
	manifest.attributes(manifestAttributes)
}

publishing {
	publications {
		register("mavenJava", MavenPublication) {
			artifactId = archivesName
			artifact remapJar
			artifact remapSourcesJar
		}
	}
	repositories {
		if(project.hasProperty("CrystaelixMavenUsername") && project.hasProperty("CrystaelixMavenPassword")) {
			maven {
				name = "CrystaelixMaven"
				url = "https://maven.crystaelix.com/releases/"
				credentials(PasswordCredentials)
			}
		}
	}
}

publishMods {
	file = remapJar.archiveFile
	version = displayName = project.version
	changelog = file("changelog.md").text
	type = STABLE
	modLoaders.add("fabric")
	additionalFiles.from(remapSourcesJar.archiveFile)

	curseforge {
		accessToken = providers.gradleProperty("curseforge.token")
		projectId = "1496726"
		minecraftVersions.add(mcVersion)
		requires "jei", "yttr"
		incompatible "emi"
	}

	modrinth {
		accessToken = providers.gradleProperty("modrinth.token")
		projectId = "YygSOzb7"
		minecraftVersions.add(mcVersion)
		requires "jei", "yttr"
		incompatible "emi"
	}
}

// Since Yttr is packaged using a jar-in-jar solid compression trick, we can't depend on it in the typical way.
// Also, Lib39 2.0.28 is not found on the maven as publishing failed.
// Therefore, we download Yttr from Modrinth and unpack all included jars into a flatDir repository for use.
def unpackYttr(String version) {
	def sourceUrl = "https://api.modrinth.com/maven/maven/modrinth/yttr/${version}/yttr-${version}.jar"
	def tempDir = file(".gradle/yttr-downloads")
	def packedJar = new File(tempDir, "yttr-${version}-packed.jar")
	def libDir = file("yttr-libs")
	def targetJar = new File(libDir, "yttr-${version}.jar")

	tempDir.mkdirs()
	libDir.mkdirs()

	if(!targetJar.exists()) {
		download.run {
			src sourceUrl
			dest packedJar
		}
		extractNested(packedJar, tempDir).each { subJar -> extractNested(subJar, tempDir) }
		fileTree(tempDir).matching { include "*.jar" }.each { jar -> jar.renameTo(new File(libDir, jar.name)) }
		tempDir.deleteDir()
	}
}

def extractNested(File sourceJar, File targetDir) {
	def extractedFiles = []
	zipTree(sourceJar).matching { include "META-INF/jars/*.jar" }.visit { details ->
		if(!details.isDirectory()) {
			File out = new File(targetDir, details.name)
			details.copyTo(out)
			extractedFiles << out
		}
	}
	return extractedFiles
}
